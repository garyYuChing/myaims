<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESL Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f0f4ff;
    --surface: #ffffff;
    --surface2: #f7f9ff;
    --border: #e2e8f7;
    --accent: #4f6ef7;
    --accent2: #ff6b9d;
    --accent3: #00c9a7;
    --accent4: #ffb347;
    --text: #1a1f3c;
    --text2: #6b7aaa;
    --shadow: 0 4px 24px rgba(79,110,247,0.10);
    --shadow-lg: 0 8px 40px rgba(79,110,247,0.18);
    --radius: 18px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── LOGIN SCREEN ── */
  #login-screen {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    background: linear-gradient(135deg, #eef2ff 0%, #fdf0ff 50%, #f0fff8 100%);
  }
  .login-card {
    background: white;
    border-radius: 28px;
    padding: 40px;
    width: 400px;
    max-width: 90vw;
    box-shadow: 0 20px 60px rgba(79,110,247,0.15);
    text-align: center;
  }
  .login-logo .icon {
    font-size: 40px; margin-bottom: 10px; display: block;
  }
  .form-group { text-align: left; margin-bottom: 15px; }
  .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; color: var(--text2); }
  .form-group input {
    width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 10px; outline: none;
  }
  .form-group input:focus { border-color: var(--accent); }
  .btn-login {
    width: 100%; padding: 14px; background: var(--accent); color: white;
    border: none; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 10px;
  }
  #login-error { color: #ff4d6d; font-size: 13px; margin-top: 10px; display: none; }

  /* ── APP LAYOUT ── */
  #app { display: none; }
  .topbar {
    height: 64px; background: white; border-bottom: 2px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
    position: sticky; top: 0; z-index: 100;
  }
  .station-badge { padding: 6px 15px; border-radius: 20px; background: #eef2ff; font-weight: 700; font-size: 14px; }
  
  .main-container { padding: 40px 20px; max-width: 1200px; margin: 0 auto; text-align: center; }
  .func-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
  .card { background: white; padding: 30px; border-radius: 20px; border: 2px solid var(--border); cursor: pointer; transition: 0.2s; }
  .card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); border-color: var(--accent); }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center; z-index: 500;
  }
  .modal-overlay.active { display: flex; }
  .modal { background: white; width: 90%; max-width: 600px; border-radius: 20px; padding: 25px; max-height: 80vh; overflow-y: auto; }
  .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
  .search-box input { flex: 1; padding: 10px; border: 2px solid var(--border); border-radius: 8px; }
  .product-item { padding: 15px; border-bottom: 1px solid var(--border); text-align: left; cursor: pointer; }
  .product-item:hover { background: var(--surface2); }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo"><span class="icon">🏷️</span><h1>AIMS Portal</h1></div>
    <div class="form-group">
      <label>帳號 (Account)</label>
      <input type="text" id="username" placeholder="請輸入帳號">
    </div>
    <div class="form-group">
      <label>密碼 (Password)</label>
      <input type="password" id="password" placeholder="請輸入密碼">
    </div>
    <button class="btn-login" onclick="doLogin()">登入系統</button>
    <div id="login-error">⚠️ 帳號或密碼錯誤</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div style="font-weight:900; font-size:20px; color:var(--accent);">ESL DASHBOARD</div>
    <div style="display:flex; gap:15px; align-items:center;">
      <div id="cur-station-name" class="station-badge">未選擇店別</div>
      <button onclick="openSettings()" style="border:none; background:none; cursor:pointer; font-size:20px;">⚙️</button>
      <button onclick="doLogout()" style="border:none; background:none; cursor:pointer; font-size:20px;">🚪</button>
    </div>
  </div>

  <div class="main-container">
    <h1 id="welcome-msg" style="font-size:32px; margin-bottom:10px;">歡迎使用</h1>
    <p style="color:var(--text2);">請選擇下方功能開始作業</p>
    
    <div class="func-grid">
      <div class="card" onclick="openProductSearch()">
        <h2 style="margin-bottom:10px;">🔍 商品查詢</h2>
        <p>搜尋店內商品與綁定狀態</p>
      </div>
      <div class="card">
        <h2 style="margin-bottom:10px;">📊 系統狀態</h2>
        <p>查看標籤與基地台連線情況</p>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="settings-modal">
  <div class="modal">
    <h3>⚙️ 系統設定</h3>
    <p style="margin: 15px 0 5px; font-size: 14px; color: var(--text2);">切換店別 (Station)</p>
    <select id="station-select" style="width:100%; padding:10px; border-radius:8px;"></select>
    <button class="btn-login" onclick="saveSettings()">儲存並套用</button>
  </div>
</div>

<div class="modal-overlay" id="product-modal">
  <div class="modal">
    <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
      <h2>商品查詢</h2>
      <button onclick="closeModals()" style="border:none; background:none; cursor:pointer;">✕</button>
    </div>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="輸入商品編號或名稱..." oninput="debounceSearch()">
    </div>
    <div id="search-results"></div>
  </div>
</div>

<script>
// ── 1. 統一狀態管理 (State) ──
let ACCESS_TOKEN = '';
let stations = [];
let currentStation = null;
let allProducts = [];
let searchTimer = null;

// ── 2. 通用 API 請求工具 ──
async function callAims(url, method = 'GET', body = null) {
  const headers = {
    'accept': 'application/json',
    'content-type': 'application/json'
  };
  
  // 如果有 Token 則注入
  if (ACCESS_TOKEN) {
    headers['Authorization'] = `Bearer ${ACCESS_TOKEN}`;
  }

  const options = { method, headers };
  if (body) options.body = JSON.stringify(body);

  try {
    const res = await fetch(url, options);
    if (res.status === 401) {
      alert('驗證逾時，請重新登入');
      doLogout();
      return null;
    }
    return res;
  } catch (e) {
    console.error("Fetch Error:", e);
    return null;
  }
}

// ── 3. 登入邏輯 ──
async function doLogin() {
  const account = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const errEl = document.getElementById('login-error');
  
  if (!account || !password) return;
  errEl.style.display = 'none';

  // 呼叫 AIMS 登入 API
  const res = await callAims('https://asia.aims.solumesl.com/portal/login', 'POST', { account, password });

  if (res && res.ok) {
    const data = await res.json();
    ACCESS_TOKEN = data.token || data.accessToken; // 取得 Token
    
    // 登入成功後接著抓取店別清單
    await fetchStations();
    
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } else {
    errEl.style.display = 'block';
  }
}

async function fetchStations() {
  const res = await callAims('https://asia.aims.solumesl.com/portal/stations?accessPoints=false');
  if (res && res.ok) {
    const data = await res.json();
    stations = (data.content || data || []);
    // 預設選第一間店
    if (stations.length > 0) {
      updateCurrentStation(stations[0]);
    }
  }
}

// ── 4. 店別切換 ──
function openSettings() {
  const sel = document.getElementById('station-select');
  sel.innerHTML = stations.map(s => `<option value="${s.code}" ${currentStation?.code === s.code ? 'selected' : ''}>${s.name} (${s.code})</option>`).join('');
  document.getElementById('settings-modal').classList.add('active');
}

function saveSettings() {
  const code = document.getElementById('station-select').value;
  const target = stations.find(s => s.code === code);
  if (target) {
    updateCurrentStation(target);
    allProducts = []; // 切換店別清單需清空
  }
  closeModals();
}

function updateCurrentStation(station) {
  currentStation = station;
  document.getElementById('cur-station-name').textContent = station.name;
  document.getElementById('welcome-msg').textContent = `歡迎使用 ${station.name}`;
}

// ── 5. 商品查詢 ──
function openProductSearch() {
  document.getElementById('product-modal').classList.add('active');
}

function debounceSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(doSearch, 500);
}

async function doSearch() {
  const query = document.getElementById('search-input').value.trim();
  if (query.length < 2) return;

  const res = await callAims(`https://asia.aims.solumesl.com/portal/articles?page=0&size=20&stationCode=${currentStation.code}&articleId=${query}`);
  if (res && res.ok) {
    const data = await res.json();
    const list = data.content || [];
    renderProducts(list);
  }
}

function renderProducts(list) {
  const container = document.getElementById('search-results');
  if (list.length === 0) {
    container.innerHTML = '<p style="padding:20px; color:gray;">查無商品</p>';
    return;
  }
  container.innerHTML = list.map(p => `
    <div class="product-item">
      <div style="font-weight:800;">${p.name || '未命名商品'}</div>
      <div style="font-size:12px; color:var(--text2);">ID: ${p.id} | 價格: ${p.price || 'N/A'}</div>
    </div>
  `).join('');
}

// ── 6. 通用功能 ──
function closeModals() {
  document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
}

function doLogout() {
  ACCESS_TOKEN = '';
  location.reload();
}
</script>
</body>
</html>
