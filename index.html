<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIMS SaaS 管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f0f9ff; }
        .glass-morphism { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        .gradient-bg { background: linear-gradient(135deg, #0ea5e9 0%, #2dd4bf 100%); }
    </style>
</head>
<body class="min-h-screen pb-24">

    <!-- 導航列 -->
    <nav class="bg-white shadow-sm p-4 flex justify-between items-center px-8 sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <div class="gradient-bg p-2 rounded-lg text-white">
                <i data-lucide="layout-grid" class="w-6 h-6"></i>
            </div>
            <span class="text-xl font-bold text-gray-800">AIMS SaaS</span>
        </div>
        
        <div class="flex items-center space-x-4">
            <button onclick="toggleSettings()" class="text-gray-500 hover:rotate-90 transition-transform duration-300">
                <i data-lucide="settings" class="w-6 h-6"></i>
            </button>
            <div class="flex items-center space-x-2 bg-gray-100 px-3 py-1 rounded-full">
                <i data-lucide="user" class="w-4 h-4 text-gray-600"></i>
                <span class="text-sm font-medium">管理者</span>
            </div>
        </div>
    </nav>

    <!-- 主畫面內容 -->
    <main class="max-w-4xl mx-auto mt-12 p-6 text-center">
        <!-- 當前店別顯示 -->
        <div id="current-station" class="mb-12">
            <h2 id="station-display" class="text-4xl font-black text-transparent bg-clip-text gradient-bg">
                請先至設定選擇店別
            </h2>
            <p class="text-gray-400 mt-2">Current Active Station</p>
        </div>

        <!-- 產品搜尋區塊 -->
        <div class="bg-white rounded-2xl shadow-xl p-8 transition-all hover:shadow-2xl">
            <div class="flex flex-col items-center space-y-6">
                <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center">
                    <i data-lucide="search" class="w-8 h-8 text-blue-500"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">PRODUCT ID 產品查詢</h1>
                
                <div class="w-full relative max-w-md">
                    <input type="text" id="product-input" placeholder="輸入 ID 進行模糊搜尋..." 
                           class="w-full px-5 py-3 rounded-xl border-2 border-blue-100 focus:border-blue-400 focus:outline-none transition-all pr-12 text-lg">
                    <button onclick="fetchArticles()" class="absolute right-3 top-3 text-blue-500">
                        <i data-lucide="refresh-cw" class="w-6 h-6"></i>
                    </button>
                </div>

                <!-- 搜尋結果列表 -->
                <div id="result-list" class="w-full max-w-md mt-4 space-y-2 text-left max-h-60 overflow-y-auto">
                    <!-- 動態生成結果 -->
                </div>
            </div>
        </div>
    </main>

    <!-- 齒輪設定抽屜 (隱藏) -->
    <div id="settings-panel" class="fixed right-0 top-0 h-full w-80 bg-white shadow-2xl translate-x-full transition-transform duration-300 z-[60] p-6 border-l">
        <div class="flex justify-between items-center mb-8">
            <h3 class="text-xl font-bold">系統設定</h3>
            <button onclick="toggleSettings()" class="text-gray-400 hover:text-red-500">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>
        <div class="space-y-4">
            <label class="block text-sm font-medium text-gray-700">選擇店別 (Station Code)</label>
            <select id="station-select" onchange="selectStation()" class="w-full p-3 rounded-lg bg-gray-50 border border-gray-200 focus:ring-2 focus:ring-blue-400 outline-none">
                <option value="">載入中...</option>
            </select>
        </div>
    </div>

    <!-- 產品明細彈窗 (Modal) -->
    <div id="detail-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[70] p-4">
        <div class="bg-white rounded-3xl w-full max-w-lg overflow-hidden animate-in fade-in zoom-in duration-300">
            <div class="gradient-bg p-6 text-white flex justify-between items-center">
                <h3 class="text-xl font-bold">產品詳細資訊</h3>
                <button onclick="closeModal()"><i data-lucide="x-circle"></i></button>
            </div>
            <div id="detail-content" class="p-6 grid grid-cols-2 gap-4 text-sm">
                <!-- 動態注入內容 -->
            </div>
            <div class="p-6 border-t bg-gray-50 text-right">
                <button onclick="closeModal()" class="px-6 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-700">關閉</button>
            </div>
        </div>
    </div>

    <!-- 底部懸浮 Mapping 按鈕 -->
    <div class="fixed bottom-8 left-1/2 -translate-x-1/2 z-50">
        <button onclick="fetchMappingInfo()" class="flex items-center space-x-2 px-8 py-4 bg-gray-900 text-white rounded-full shadow-2xl hover:scale-105 active:scale-95 transition-all group">
            <i data-lucide="link" class="w-5 h-5 group-hover:rotate-12 transition-transform"></i>
            <span class="font-bold tracking-wider">查詢 MappingInfo</span>
        </button>
    </div>

    <script>
        const API_KEY = 'NsKQvyOF.zguBCKAfwFCLBgIizGGaClomAJebJVZaRxy';
        let currentStationCode = '';
        let allArticles = [];

        // 初始化 Lucide 圖標
        lucide.createIcons();

        // 1. 頁面載入後抓取店別
        async function fetchStations() {
            try {
                const response = await fetch('https://asia.aims.solumesl.com/portal/stations?accessPoints=false', {
                    headers: { 'accept': 'application/json', 'api-key': API_KEY }
                });
                const data = await response.json();
                const select = document.getElementById('station-select');
                select.innerHTML = '<option value="">請選擇店別</option>';
                data.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.code;
                    option.text = `${item.code} ${item.name}`;
                    select.appendChild(option);
                });
            } catch (err) { alert('載入店別失敗'); }
        }

        function toggleSettings() {
            document.getElementById('settings-panel').classList.toggle('translate-x-full');
        }

        function selectStation() {
            const select = document.getElementById('station-select');
            const display = document.getElementById('station-display');
            currentStationCode = select.value;
            display.innerText = select.options[select.selectedIndex].text;
            toggleSettings();
            // 切換店別時重新清空產品資料
            allArticles = [];
            document.getElementById('result-list').innerHTML = '';
        }

        // 2. 獲取所有產品資料 (功能1)
        async function fetchArticles() {
            if (!currentStationCode) return alert('請先選擇店別！');
            
            try {
                const response = await fetch(`https://asia.aims.solumesl.com/portal/articles?page=0&size=50&sort=id%2CASC&stationCode=${currentStationCode}`, {
                    headers: { 'accept': 'application/json', 'api-key': API_KEY }
                });
                allArticles = await response.json();
                alert(`已同步 ${allArticles.length} 筆產品資料`);
            } catch (err) { alert('獲取產品資料失敗'); }
        }

        // 模糊搜尋監聽
        document.getElementById('product-input').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const list = document.getElementById('result-list');
            list.innerHTML = '';
            
            if (val.length < 1) return;

            const filtered = allArticles.filter(item => item.id.includes(val));
            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = "p-3 bg-white border border-blue-50 rounded-lg cursor-pointer hover:bg-blue-50 transition-colors shadow-sm";
                div.innerHTML = `<span class="font-bold text-blue-600">${item.id}</span> - <span class="text-gray-700">${item.name}</span>`;
                div.onclick = () => showDetail(item);
                list.appendChild(div);
            });
        });

        // 3. 顯示明細頁面
        function showDetail(item) {
            const content = document.getElementById('detail-content');
            const fields = {
                "店別": item.stationCode || currentStationCode,
                "ID": item.id,
                "名稱": item.name,
                "關聯碼": item.references || 'N/A',
                "原始價格": item.originalPrice || 'N/A',
                "主條碼": item.mainBarcode || 'N/A',
                "SKU": item.sku || 'N/A',
                "項目代碼": item.itemCode || 'N/A',
                "現價": item.price || 'N/A'
            };
            
            content.innerHTML = Object.entries(fields).map(([key, val]) => `
                <div class="bg-gray-50 p-3 rounded-lg">
                    <p class="text-xs text-gray-400 uppercase">${key}</p>
                    <p class="font-bold text-gray-800 break-all">${val}</p>
                </div>
            `).join('');

            document.getElementById('detail-modal').classList.remove('hidden');
            document.getElementById('detail-modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
            document.getElementById('detail-modal').classList.remove('flex');
        }

        // 4. 底部 Mapping 按鈕功能
        async function fetchMappingInfo() {
            if (!currentStationCode) return alert('請先選擇店別！');
            // 根據需求使用固定的示例參數或根據選中的產品 ID
            const testId = allArticles[0]?.id || '1485605900101';
            
            try {
                const response = await fetch(`https://asia.aims.solumesl.com/portal/articles/mappingInfo?stationCode=${currentStationCode}&searchKey=ARTICLE_ID&value=${testId}`, {
                    headers: { 'accept': 'application/json', 'api-key': API_KEY }
                });
                const data = await response.json();
                console.log(data);
                alert('Mapping Info 已取得 (詳細請看 Console)：\nEAN: ' + (data[0]?.eans || '無資料'));
            } catch (err) { alert('Mapping 查詢失敗'); }
        }

        // 初始化
        fetchStations();
    </script>
</body>
</html>
